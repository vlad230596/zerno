name: Deploy master to development

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Master ref to verify and deploy
        required: false
        default: master
        type: string

concurrency:
  group: zerno-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manual-quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  prepare:
    # The fork guard matters: CI also runs on pull_request, and for a pull
    # request from a fork the triggering run's head branch is the fork's branch
    # name. Without the repository check, a fork branch called master would let
    # untrusted code reach the job that holds the deployment secrets.
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master') ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality.result == 'success'))
    needs: [manual-quality]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
      - name: Resolve immutable development version
        id: version
        run: |
          sha="$(git rev-parse HEAD)"
          # A manual run accepts an arbitrary ref. Require it to be on master,
          # so a pull request merge ref cannot carry untrusted code into the
          # job that holds the deployment secrets.
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "Commit $sha is not an ancestor of master." >&2
            exit 64
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=dev-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite inlines these at build time, so the development bundle is bound to
      # the development origin and its own ZenMoney consumer key.
      - name: Build development bundle
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_SOURCEMAP: 'true'
          REACT_APP_REDIRECT_URI: ${{ vars.DEV_URL }}
          REACT_APP_CLIENT_ID: ${{ secrets.ZENMONEY_DEV_CLIENT_ID }}
          REACT_APP_CLIENT_SECRET: ${{ secrets.ZENMONEY_DEV_CLIENT_SECRET }}
        run: |
          test -n "$REACT_APP_REDIRECT_URI"
          test -n "$REACT_APP_CLIENT_ID"
          test -n "$REACT_APP_CLIENT_SECRET"
          pnpm exec vite build

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zerno-web:dev-master
            ghcr.io/${{ github.repository_owner }}/zerno-web:dev-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/zerno-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, publish]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/zerno-web@${{ needs.publish.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Configure development SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/zerno-development
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/zerno-development ~/.ssh/known_hosts

      - name: Deploy immutable image to development
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/zerno-development \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/zerno-dev-deploy '$VERSION' '$WEB_IMAGE' '${{ github.actor }}'"

name: Release Zerno

on:
  workflow_dispatch:
    inputs:
      version:
        description: New SemVer version to approve, tag, and deploy from master
        required: true
        type: string

concurrency:
  group: zerno-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      ref: ${{ steps.release.outputs.ref }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
      - name: Validate release input
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/master' ]]; then
            echo 'Release workflow must be started from master.' >&2
            exit 64
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be a SemVer core such as 1.0.0.' >&2
            exit 64
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 65
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  approve:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create approved release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION was created while approval was pending." >&2
            exit 65
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$VERSION" "$RELEASE_SHA" --message "Zerno $VERSION"
          git push origin "refs/tags/$VERSION"

  publish:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production credentials and the production origin are inlined here, so
      # this bundle is not interchangeable with the development one.
      - name: Build production bundle
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          REACT_APP_REDIRECT_URI: ${{ vars.PRODUCTION_URL }}
          REACT_APP_CLIENT_ID: ${{ secrets.ZENMONEY_CLIENT_ID }}
          REACT_APP_CLIENT_SECRET: ${{ secrets.ZENMONEY_CLIENT_SECRET }}
        run: |
          test -n "$REACT_APP_REDIRECT_URI"
          test -n "$REACT_APP_CLIENT_ID"
          test -n "$REACT_APP_CLIENT_SECRET"
          pnpm exec vite build

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zerno-web:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zerno-web:sha-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/zerno-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/zerno-web@${{ needs.publish.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Configure production SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/zerno-production
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/zerno-production ~/.ssh/known_hosts

      - name: Deploy immutable image to production
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/zerno-production \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/zerno-deploy '$VERSION' '$WEB_IMAGE' '${{ github.actor }}'"

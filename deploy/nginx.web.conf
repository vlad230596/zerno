server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression and security headers belong to the Caddy ingress, so that
    # there is exactly one place where they are configured.
    charset utf-8;
    server_tokens off;

    # Vite writes content hashes into these names, so the same URL is never
    # reused for different bytes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell, the worker and the manifest decide when a client picks up a new
    # release. Caching them would strand people on an old build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-store";
    }
    location = /manifest.json {
        add_header Cache-Control "no-store";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # The push alarm clock (deploy/push) runs beside this container, so the
    # page reaches it on its own origin and Caddy needs no route of its own.
    # Resolved per request through Docker's DNS: a stand without the push
    # service answers 502 here instead of refusing to start.
    location /push/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $push_upstream http://push:8080;
        proxy_pass $push_upstream;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }

    # Single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

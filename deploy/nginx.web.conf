server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression and security headers belong to the Caddy ingress, so that
    # there is exactly one place where they are configured.
    charset utf-8;
    server_tokens off;

    # Vite writes content hashes into these names, so the same URL is never
    # reused for different bytes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell, the worker and the manifest decide when a client picks up a new
    # release. Caching them would strand people on an old build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-store";
    }
    location = /manifest.json {
        add_header Cache-Control "no-store";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
